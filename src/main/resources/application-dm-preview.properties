# Opt-in local preview. This database and storage are separate from normal development data.
server.address=127.0.0.1
spring.datasource.url=jdbc:sqlite:volumes/dm-preview.db?journal_mode=WAL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually
chat.storage=local
chat.local-directory=volumes/dm-preview-chat
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
spring.devtools.restart.enabled=false
aws.s3.access-key-id=
aws.s3.secret-access-key=
spring.task.scheduling.enabled=false
